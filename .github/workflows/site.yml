name: Publicar Site
on:
  push:
    branches: ["main"]
 workflow_dispatch:
 permissions:
   contents: read
   pages: write
   id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name:Baixar Codigo
      - uses: actions/checkout@v4
      - name:Instalar Node
      - uses: actions/setup-node@v4
      with:
        node-version: 18
    - name:Instalar Dependencias
    run: npm install
   - name: Construir Site
    run: npm run build
   - name: Upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'
deploy:
  needs: build
  runs-on:ubuntu-latest
  environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}
steps:
  - name: Publicar
  uses: actions/deploy-pages@v4
  id: deployment
  
      


  
      







    
